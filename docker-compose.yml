services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - app-network

  interfaces:
    build:
      context: ./uis
      dockerfile: Dockerfile
    command: ["/usr/local/bin/start.sh"]
    environment:
      API_INTERNAL_URL: http://host.docker.internal:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:3000"
    volumes:
      - type: bind
        source: ./uis/backoffice
        target: /app
      - type: volume
        source: interfaces_node_modules
        target: /app/node_modules
      - type: volume
        source: interfaces_next
        target: /app/.next
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network

  backend:
    build:
      context: .
      dockerfile: services/Dockerfile
    env_file:
      - path: ./.env.example
        required: true
      - path: ./services/api/.env
        required: false
      - path: ./.env
        required: false
    environment:
      PYTHONUNBUFFERED: "1"
      QDRANT_URL: http://qdrant:6333
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBEDDING_MODEL_ID: ${EMBEDDING_MODEL_ID:-}
      GENERATION_MODEL_ID: ${GENERATION_MODEL_ID:-}
    working_dir: /workspace/services/api
    command: ["sh", "-c", "python seed_records.py && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    ports:
      - "8000:8000"
    volumes:
      - type: bind
        source: ./services/api
        target: /workspace/services/api
      - type: bind
        source: ./packages/shared
        target: /workspace/packages/shared
      - type: volume
        source: backend_data
        target: /workspace/services/api/data
    networks:
      - app-network

networks:
  app-network:
    name: nexova-development
    driver: bridge

volumes:
  interfaces_node_modules:
  interfaces_next:
  backend_data:
  qdrant_storage:
