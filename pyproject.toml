[project]
name = "nexova-suppliers-api"
version = "0.1.0"
description = "Directorio de Proveedores API - Nexova Solutions"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "pydantic",
    "tinydb",
    "uvicorn",
    "httpx",
    "scikit-learn>=1.7.2",
    "matplotlib>=3.10.9",
    "qdrant-client>=1.20.0",
    "openai>=3.49.0",
]

[project.scripts]
seed = "services.api.seed:main"

[tool.setuptools.packages.find]
include = ["services*"]

[tool.pytest.ini_options]
testpaths = ["services/api/tests"]
